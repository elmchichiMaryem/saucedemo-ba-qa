[pytest]
testpaths = tests
bdd_features_base_dir = features
base_url = https://www.saucedemo.com
addopts =
    -v
    --strict-markers
    --html=reports/rapport_tests.html
    --self-contained-html
markers =
    smoke: tests rapides du parcours critique
    regression: suite complète de non-régression
    authentification: EP-01 Authentification
    catalogue: EP-02 Catalogue
    panier: EP-03 Panier
    commande: EP-04 Commande
    anomalies: scénarios mettant en évidence une anomalie connue (xfail)
